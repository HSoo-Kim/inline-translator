<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 800px; height: 460px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #e0f2fe 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  .window {
    width: 620px; height: 390px; background: #fff; border-radius: 14px;
    box-shadow: 0 18px 50px rgba(30, 41, 89, .18), 0 2px 6px rgba(30, 41, 89, .08);
    display: flex; flex-direction: column; overflow: hidden; position: relative;
  }
  .titlebar { height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid #eef0f4; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .name { font-weight: 600; font-size: 15px; color: #111827; }
  .status { font-size: 12px; color: #10b981; }
  .chat { flex: 1; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; background: #f8fafc; }
  .bubble { max-width: 76%; padding: 9px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.4; }
  .in { background: #fff; border: 1px solid #e5e7eb; align-self: flex-start; border-bottom-left-radius: 5px; color: #111827; }
  .out { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 5px; }
  .composer { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-top: 1px solid #eef0f4; }
  .input { flex: 1; min-height: 40px; border-radius: 20px; background: #f1f5f9; padding: 10px 16px; font-size: 14.5px; color: #111827;
    display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  .input .text.selected { background: #bfdbfe; border-radius: 3px; }
  .input .text.fresh { background: #dcfce7; border-radius: 3px; transition: none; }
  .placeholder { color: #94a3b8; }
  .caret { display: inline-block; width: 1.5px; height: 18px; background: #2563eb; margin-left: 1px; }
  .send { width: 40px; height: 40px; border-radius: 50%; background: #2563eb; display: flex; align-items: center; justify-content: center; }
  .send svg { width: 18px; height: 18px; fill: #fff; }
  .chip { position: absolute; left: 0; top: 0; background: #2563eb; color: #fff; font-size: 13px; padding: 7px 12px; border-radius: 8px;
    box-shadow: 0 6px 18px rgba(37, 99, 235, .35); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .spinner { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; }
  .keys { position: absolute; left: 50%; top: 190px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
  .key { min-width: 54px; height: 50px; padding: 0 14px; border-radius: 10px; background: #111827; color: #fff; font-size: 18px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #374151, 0 10px 24px rgba(17,24,39,.25); }
  .plus { color: #475569; font-size: 20px; font-weight: 700; }
  .caption { text-align: center; font-size: 14px; color: #475569; }
  .caption b { color: #1d4ed8; }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="avatar">A</div>
    <div><div class="name">Alex</div><div class="status">online</div></div>
  </div>
  <div class="chat" id="chat">
    <div class="bubble in">Hey! Are you joining the meeting tomorrow?</div>
  </div>
  <div class="composer">
    <div class="input" id="input"></div>
    <div class="send"><svg viewBox="0 0 24 24"><title>Send</title><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></div>
  </div>
</div>
<div class="keys" id="keys"><div class="key">Ctrl</div><div class="plus">+</div><div class="key">Alt</div><div class="plus">+</div><div class="key">T</div></div>
<div class="chip" id="chip"><div class="spinner" id="spinner"></div><span id="chipText"></span></div>
<div class="caption" id="caption"></div>
<script>
  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") === "en" ? "en" : "ko";
  const copy = {
    ko: { placeholder: "메시지 입력", busy: "English 번역 중…", caption: "쓰고 <b>Ctrl+Alt+T</b> 한 번 · 그 자리에서 바로 번역" },
    en: { placeholder: "Message", busy: "Translating to English…", caption: "Type, press <b>Ctrl+Alt+T</b> · translated right where you typed" },
  }[lang];
  const korean = "응! 근데 몇 시에 시작해? 조금 늦을 것 같아 ㅠㅠ";
  const english = "Yes! But what time does it start? I'm worried I might be a bit late ㅠㅠ";
  const T = { typeStart: 0.5, typeEnd: 3.0, keys: 3.5, keysEnd: 4.5, busyEnd: 6.6, send: 8.0, end: 10.0 };

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const chip = document.getElementById("chip");
  const keys = document.getElementById("keys");
  document.getElementById("caption").innerHTML = copy.caption;
  document.getElementById("chipText").textContent = copy.busy;

  const clamp = (v) => Math.max(0, Math.min(1, v));
  const ease = (v) => 1 - Math.pow(1 - clamp(v), 3);

  window.render = (t) => {
    let text = "", cls = "", caret = true, sent = false;
    if (t < T.typeStart) text = "";
    else if (t < T.typeEnd) text = korean.slice(0, Math.round(korean.length * (t - T.typeStart) / (T.typeEnd - T.typeStart)));
    else if (t < T.busyEnd) { text = korean; if (t >= T.keys) { cls = "selected"; caret = false; } }
    else if (t < T.send) { text = english; cls = t < T.busyEnd + 0.7 ? "fresh" : ""; }
    else { text = ""; sent = true; }
    input.innerHTML = text
      ? `<span class="text ${cls}"></span>${caret ? '<span class="caret"></span>' : ""}`
      : `<span class="placeholder">${copy.placeholder}</span>`;
    if (text) input.querySelector(".text").textContent = text;

    for (const node of chat.querySelectorAll(".out")) node.remove();
    if (sent) {
      const bubble = document.createElement("div");
      bubble.className = "bubble out";
      bubble.textContent = english;
      const p = ease((t - T.send) / 0.35);
      bubble.style.opacity = p;
      bubble.style.transform = `translateY(${(1 - p) * 14}px)`;
      chat.appendChild(bubble);
    }

    const keyIn = ease((t - T.keys) / 0.2), keyOut = ease((t - T.keysEnd) / 0.25);
    keys.style.opacity = t < T.keys ? 0 : keyIn * (1 - keyOut);
    keys.style.transform = `translateX(-50%) scale(${0.92 + 0.08 * keyIn})`;

    const busy = t >= T.keys + 0.25 && t < T.busyEnd;
    chip.style.opacity = busy ? ease((t - T.keys - 0.25) / 0.15) : 0;
    const box = input.getBoundingClientRect();
    chip.style.left = `${Math.min(box.left + 40, 520)}px`;
    chip.style.top = `${box.top - 44}px`;
    document.getElementById("spinner").style.transform = `rotate(${t * 540}deg)`;

    const fade = t > T.end - 0.35 ? 1 - ease((t - (T.end - 0.35)) / 0.35) : 1;
    document.querySelector(".window").style.opacity = fade;
  };
  window.duration = T.end;
  render(0);
</script>
</body>
</html>
